---
- name: "KT-2 alternative: ONLYOFFICE Workspace Community via Docker"
  hosts: onlyoffice_nodes
  become: true
  gather_facts: true

  vars:
    # This installer is distributed only for amd64 Linux.
    docker_apt_arch: amd64

  pre_tasks:
    - name: Confirm target OS, architecture, resources and explicit approval
      ansible.builtin.assert:
        that:
          - onlyoffice_install_confirm | bool
          - ansible_distribution == 'Ubuntu'
          - ansible_architecture == 'x86_64'
          - (ansible_processor_vcpus | int) >= 4
          - (ansible_memtotal_mb | int) >= 7500
          - (ansible_mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | default(0) | int) >= 40 * 1024 * 1024 * 1024
        fail_msg: >-
          Set -e onlyoffice_install_confirm=true and use a dedicated Ubuntu
          amd64 VM with >=4 vCPU, ~8GB RAM and >=40GiB free disk.

  tasks:
    # Install Docker using the same tasks as the primary exercise.
    - name: Install Docker Engine from the official signed APT repository
      ansible.builtin.include_tasks: tasks/install_docker.yml

    - name: Install OpenSSL for strong local database password generation
      ansible.builtin.apt:
        name: openssl
        state: present

    # The official installer uses the following predictable container names.
    # Check all main components to detect an incomplete previous installation.
    - name: Check whether required ONLYOFFICE containers already exist
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - onlyoffice-community-server
          - onlyoffice-document-server
          - onlyoffice-control-panel
      register: onlyoffice_existing
      changed_when: false
      failed_when: false

    - name: Install ONLYOFFICE once if components are missing
      when: onlyoffice_existing.rc != 0
      block:
        - name: Create protected directory for installer and secrets
          ansible.builtin.file:
            path: "{{ onlyoffice_installer_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        # Generate passwords once on the server; do not store them in Git.
        - name: Generate persistent random MySQL root password
          ansible.builtin.shell: >-
            umask 077 && openssl rand -hex 32 >
            {{ onlyoffice_installer_dir }}/mysql-root.secret
          args:
            creates: "{{ onlyoffice_installer_dir }}/mysql-root.secret"
          no_log: true

        - name: Generate persistent random application MySQL password
          ansible.builtin.shell: >-
            umask 077 && openssl rand -hex 32 >
            {{ onlyoffice_installer_dir }}/mysql-app.secret
          args:
            creates: "{{ onlyoffice_installer_dir }}/mysql-app.secret"
          no_log: true

        - name: Read MySQL root password from root-only target file
          ansible.builtin.slurp:
            src: "{{ onlyoffice_installer_dir }}/mysql-root.secret"
          register: onlyoffice_root_secret
          no_log: true

        - name: Read MySQL application password from root-only target file
          ansible.builtin.slurp:
            src: "{{ onlyoffice_installer_dir }}/mysql-app.secret"
          register: onlyoffice_app_secret
          no_log: true

        # Download the official Docker-specific installer directly, avoiding
        # the interactive wrapper and its internal plain-HTTP download.
        - name: Download official ONLYOFFICE Docker installer over HTTPS
          ansible.builtin.get_url:
            url: "{{ onlyoffice_installer_url }}"
            dest: "{{ onlyoffice_installer_dir }}/install.sh"
            owner: root
            group: root
            mode: "0700"
            validate_certs: true
            force: false
            checksum: >-
              {{ ('sha256:' ~ onlyoffice_installer_sha256)
                 if (onlyoffice_installer_sha256 | length == 64) else omit }}

        # WORKSPACE selects the free community edition; --installmailserver
        # false is the crucial condition from the KT-2 assignment.
        - name: Install ONLYOFFICE Workspace Community without Mail Server
          ansible.builtin.command:
            argv:
              - bash
              - "{{ onlyoffice_installer_dir }}/install.sh"
              - --installationtype
              - WORKSPACE
              - --installcs
              - "true"
              - --installdocs
              - "true"
              - --installcontrolpanel
              - "true"
              - --installmailserver
              - "false"
              - --communityport
              - "{{ onlyoffice_listen_port | string }}"
              - --mysqlrootpassword
              - "{{ onlyoffice_root_secret.content | b64decode | trim }}"
              - --mysqlpassword
              - "{{ onlyoffice_app_secret.content | b64decode | trim }}"
              - --jwtenabled
              - "true"
          args:
            chdir: "{{ onlyoffice_installer_dir }}"
          async: 3600
          poll: 20
          no_log: true

    # Check that installation is complete, not just that the script returned.
    - name: Verify the three main ONLYOFFICE containers exist
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - onlyoffice-community-server
          - onlyoffice-document-server
          - onlyoffice-control-panel
      register: onlyoffice_components
      changed_when: false

    - name: Verify ONLYOFFICE Mail Server container is absent
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - onlyoffice-mail-server
      register: onlyoffice_mail_check
      changed_when: false
      failed_when: false

    - name: Assert that Mail Server was not installed
      ansible.builtin.assert:
        that:
          - onlyoffice_mail_check.rc != 0
        fail_msg: "ONLYOFFICE Mail Server is present. Use a fresh VM."

    # Wait for the HTTP portal to start (its first launch can be slow).
    - name: Check local ONLYOFFICE Workspace HTTP endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ onlyoffice_listen_port }}/"
        follow_redirects: none
        status_code: [200, 301, 302, 303]
        return_content: false
      register: onlyoffice_http
      until: onlyoffice_http is succeeded
      retries: 30
      delay: 10

    - name: Explain how to open the portal after deployment
      ansible.builtin.debug:
        msg: >-
          ONLYOFFICE Workspace: http://{{ ansible_host | default(inventory_hostname) }}:
          {{ onlyoffice_listen_port }} (Mail Server skipped)
